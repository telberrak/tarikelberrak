server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: portfolio-backend

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}
    username: ${DB_USER:portfolio}
    password: ${DB_PASSWORD:portfolio}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  site-url: ${SITE_URL:http://localhost:3000}
  admin-email: ${ADMIN_EMAIL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32chars}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
    contact-notification: ${CONTACT_NOTIFICATION_EMAIL:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# Sentry's auto-configuration no-ops when dsn is blank — nothing to gate manually.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: 0.1

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
