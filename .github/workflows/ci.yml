name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - name: Dependency audit (report only, doesn't fail the build yet)
        run: npm audit --audit-level=high
        continue-on-error: true

  backend:
    name: Backend (Testcontainers integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - working-directory: backend
        run: mvn -B verify

      - name: Cache OWASP dependency-check NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-

      - name: Dependency audit (report only, doesn't fail the build yet)
        working-directory: backend
        # NVD_API_KEY is optional but strongly recommended — without one, NVD
        # rate-limits this heavily. Get a free key at nvd.nist.gov/developers
        # and add it as a repo secret to speed this up.
        run: >
          mvn -B org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=11
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
        continue-on-error: true

  e2e:
    name: End-to-end smoke test
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose up -d --build
        env:
          JWT_SECRET: ci-test-secret-ci-test-secret-32ch
          DB_PASSWORD: ci-test-password

      - name: Wait for the backend to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9090/actuator/health && exit 0
            sleep 2
          done
          echo "Backend never became healthy" >&2
          exit 1

      - run: npx playwright test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
